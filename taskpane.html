<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>عون — مساعدك القانوني داخل Word</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet"/>
<style>
:root{--green:#123c2a;--green2:#1f5a3e;--green3:#25935f;--gold:#bd9552;--gold2:#d9b978;--ink:#17212f;--muted:#64748b;--line:#e2e8ee;--bg:#f4f6f9}
*{box-sizing:border-box;font-family:"Tajawal",sans-serif}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);display:flex;flex-direction:column;height:100vh;overflow:hidden}
.hidden{display:none!important}

/* ===== الرأس ===== */
.top{background:linear-gradient(135deg,#164733,var(--green));color:#fff;padding:11px 13px;display:flex;align-items:center;gap:10px;flex:0 0 auto;position:relative;z-index:20}
.top .lg{width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,.13);display:flex;align-items:center;justify-content:center;flex:0 0 auto;overflow:hidden;color:var(--gold2);font-weight:900}
.top .lg img{width:24px;height:24px;object-fit:contain}
.top .ti{flex:1;min-width:0}.top .ti b{font-size:.98rem;font-weight:900}.top .ti span{display:block;font-size:.62rem;color:rgba(255,255,255,.68);margin-top:1px}
.row2{display:flex;gap:6px;align-items:center}
.mdl{position:relative}
.mdl .btn{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);color:#fff;border-radius:999px;padding:6px 11px;font-family:inherit;font-size:.72rem;font-weight:800;cursor:pointer}
.mdl .btn .dot{width:6px;height:6px;border-radius:50%;background:var(--gold2)}
.mdl .menu{position:absolute;top:38px;inset-inline-start:0;background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 34px rgba(15,23,42,.2);padding:5px;min-width:186px;display:none;z-index:30}
.mdl.open .menu{display:block}
.mdl .menu button{display:flex;align-items:center;gap:9px;width:100%;background:none;border:none;border-radius:9px;padding:8px 10px;font-family:inherit;font-size:.76rem;font-weight:800;color:var(--ink);cursor:pointer;text-align:right}
.mdl .menu button:hover{background:#f4f8f6}.mdl .menu button.on{background:#eef7f2}
.mdl .menu .k{width:7px;height:7px;border-radius:50%;background:var(--green3);flex:0 0 auto}.mdl .menu .sub{font-size:.64rem;color:var(--muted);font-weight:700}
.hb{width:32px;height:32px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);border-radius:9px;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center}
.hb:hover{background:rgba(255,255,255,.2)}.hb svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ground{background:linear-gradient(90deg,#f7f9f7,#fffaf0);border-bottom:1px solid #e7ece8;padding:6px 13px;display:flex;align-items:center;gap:7px;flex:0 0 auto}
.ground svg{flex:0 0 auto}.ground span{font-size:.66rem;color:#3f5a4b;font-weight:800}

/* ===== سجل المحادثات ===== */
.histbar{background:#fff;border-bottom:1px solid var(--line);flex:0 0 auto;position:relative;z-index:15}
.histpanel{display:none;max-height:210px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#cdd6df transparent}
.histpanel::-webkit-scrollbar{width:8px}.histpanel::-webkit-scrollbar-thumb{background:#cdd6df;border-radius:99px;border:2px solid transparent;background-clip:padding-box}
.histbar.open .histpanel{display:block}
.histempty{padding:12px;color:var(--muted);font-size:.76rem;font-weight:800;text-align:center}
.hitem{width:100%;border:0;border-bottom:1px solid #eef2ef;background:#fff;padding:10px 12px;text-align:right;font-family:inherit;cursor:pointer;color:var(--ink);display:flex;align-items:center;gap:8px}
.hitem:hover,.hitem.on{background:#f6faf7}
.hitem>span:first-child{flex:1;font-size:.78rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hitem .del{color:#c0392b;font-size:.8rem;opacity:.7}

/* ===== الدردشة ===== */
.chat{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:12px;min-height:0;scrollbar-width:thin;scrollbar-color:#cdd6df transparent}
.chat::-webkit-scrollbar{width:9px}.chat::-webkit-scrollbar-track{background:transparent}
.chat::-webkit-scrollbar-thumb{background:#cdd6df;border-radius:99px;border:3px solid transparent;background-clip:padding-box}
.chat::-webkit-scrollbar-thumb:hover{background:#a8b3bf;background-clip:padding-box}
.chat::-webkit-scrollbar-button{display:none;height:0;width:0}
.welcome{margin:auto 0;text-align:center;padding:6px}
.welcome h2{font-size:1.02rem;font-weight:900;margin:0 0 5px;color:var(--green)}
.welcome p{font-size:.78rem;color:var(--muted);margin:0 0 16px}
.chips{display:flex;flex-direction:column;gap:8px;max-width:320px;margin:0 auto}
.wchip{background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px 13px;font-size:.82rem;font-weight:800;color:var(--ink);cursor:pointer;text-align:right;display:flex;align-items:center;gap:9px;transition:.16s;box-shadow:0 3px 12px rgba(15,23,42,.04)}
.wchip:hover{border-color:var(--gold);background:#fffdf8;transform:translateY(-1px)}
.wchip .ic{color:var(--gold);flex:0 0 auto}
.msg{display:flex;gap:8px}
.av{width:26px;height:26px;border-radius:7px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:.66rem;background:linear-gradient(135deg,var(--green2),var(--green));color:var(--gold2);overflow:hidden}
.av img{width:21px;height:21px;object-fit:contain}
.msg.u .av{background:#e8eef5;color:var(--green2)}
.bub{background:#fff;border:1px solid var(--line);border-radius:11px;padding:9px 11px;flex:1;min-width:0;font-size:.82rem;line-height:1.85;box-shadow:0 2px 8px rgba(15,23,42,.04);word-break:break-word}
.msg.u .bub{background:#eef7f2;border-color:#d5eae0;white-space:pre-wrap}
.bub .tx.md p{margin:0 0 7px}.bub .tx.md p:last-child{margin:0}
.bub h3,.bub h4,.bub h5{color:var(--green);font-weight:900;margin:9px 0 4px;font-size:.9rem}
.bub ol,.bub ul{margin:5px 0 8px;padding-inline-start:20px}.bub li{margin-bottom:4px}
.bub strong{font-weight:900}.bub code{background:#f1f5f4;border-radius:4px;padding:1px 4px;font-size:.9em}
.bub blockquote{margin:6px 0;padding:5px 11px;border-inline-start:3px solid var(--gold);background:#fbf8f1;color:#5b4a26;border-radius:6px}
.bub .status{color:var(--muted);font-style:italic}
.bub .atts{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:7px}
.bub .att-mini{font-size:.66rem;font-weight:800;background:#f4f6f9;border:1px solid var(--line);border-radius:7px;padding:3px 7px}
/* تفكير عون */
.think{border:1px solid #e2ece6;border-radius:9px;background:linear-gradient(180deg,#f4faf6,#fff);margin-bottom:8px;overflow:hidden}
.think .th-head{display:flex;align-items:center;gap:7px;padding:7px 10px;cursor:pointer}
.think .th-ic{width:19px;height:19px;border-radius:6px;background:#e8f5ee;color:var(--green2);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.think .th-ic svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.think .th-title{font-size:.72rem;font-weight:800;color:var(--green2)}
.think .th-dots{display:inline-flex;gap:3px;margin-inline-start:4px}
.think .th-dots i{width:5px;height:5px;border-radius:50%;background:var(--green3);animation:akb 1s infinite}
.think .th-dots i:nth-child(2){animation-delay:.2s}.think .th-dots i:nth-child(3){animation-delay:.4s}
.think .th-chev{margin-inline-start:auto;color:#9fb2a8;transition:.15s}
.think.open .th-chev{transform:rotate(-90deg)}
.think .th-body{display:none;padding:0 11px 10px;font-size:.72rem;line-height:1.75;color:#4a5a52;white-space:pre-wrap;max-height:210px;overflow-y:auto}
.think.open .th-body{display:block}
/* مؤشرات الأداء */
.akm{margin-top:9px;padding-top:8px;border-top:1px solid #eef1f4;display:flex;flex-wrap:wrap;gap:5px}
.akm .it{font-size:.61rem;font-weight:800;color:var(--muted);background:#f7f9fb;border:1px solid var(--line);border-radius:999px;padding:3px 8px;display:inline-flex;align-items:center;gap:4px}
.akm .it svg{width:11px;height:11px;fill:none;stroke:var(--green3);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.akm .it b{color:var(--ink)}.akm .it.cost b{color:#a9752f}.akm .it.model{background:#eef7f2;border-color:#d5eae0;color:var(--green2)}
/* عدّاد حيّ */
.aklive{display:inline-flex;align-items:center;gap:9px;background:linear-gradient(180deg,#f4faf6,#fff);border:1px solid #c7e0d1;border-radius:11px;padding:7px 12px;box-shadow:0 4px 16px rgba(31,90,62,.08);margin-top:4px;flex-wrap:wrap}
.aklive .ld{width:9px;height:9px;border-radius:50%;background:var(--gold);animation:akpp 1s infinite}
.aklive .lb{font-size:.75rem;font-weight:900;color:var(--green2)}
.aklive .lv{width:1px;height:14px;background:var(--line)}
.aklive .m{display:inline-flex;align-items:center;gap:4px;font-size:.7rem;font-weight:800;color:var(--muted)}
.aklive .m svg{width:12px;height:12px;fill:none;stroke:var(--green3);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.aklive .m b{color:var(--ink);font-weight:900;font-variant-numeric:tabular-nums}
/* أزرار الإجراء */
.acts{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.acts .ins{flex:1;min-width:120px;background:linear-gradient(135deg,var(--green3),var(--green2));color:#fff;border:none;border-radius:8px;padding:8px;font-family:inherit;font-weight:900;font-size:.74rem;cursor:pointer}
.acts .sec{background:#fff;border:1px solid var(--line);color:#475569;border-radius:8px;padding:8px 11px;font-family:inherit;font-weight:800;font-size:.72rem;cursor:pointer}
.acts .sec:hover{background:#f6faf7;border-color:var(--green3)}
/* المؤشّر أثناء الكتابة */
.typing{display:inline-flex;gap:4px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--green3);animation:akb 1s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
.ak-stopchip{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-size:.7rem;font-weight:800;color:var(--muted);background:#f4f6f8;border:1px solid var(--line);border-radius:999px;padding:4px 11px}
.ak-stopchip svg{width:12px;height:12px;fill:currentColor;color:#c0392b}
/* بطاقة السؤال بخيارات */
.ask{border:1px solid #d7e6dd;border-radius:13px;background:linear-gradient(180deg,#f4faf6,#fff);overflow:hidden;margin-top:12px}
.ask-h{display:flex;align-items:center;gap:8px;padding:10px 12px 8px}
.ask-h .ic{width:24px;height:24px;border-radius:7px;background:#fff4e2;color:var(--gold);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.ask-h .ic svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ask-h b{font-size:.8rem;font-weight:900;color:var(--green2);line-height:1.5}
.ask-opts{display:flex;flex-direction:column;gap:7px;padding:0 12px 4px}
.opt{display:flex;align-items:center;gap:9px;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;cursor:pointer;transition:.14s;text-align:right;font-family:inherit;width:100%}
.opt:hover{border-color:var(--green3);background:#f6fbf8;transform:translateY(-1px)}
.opt:disabled{opacity:.55;cursor:default;transform:none}
.opt .n{width:22px;height:22px;flex:0 0 auto;border-radius:50%;border:1.5px solid var(--gold);color:var(--gold);font-weight:900;font-size:.72rem;display:flex;align-items:center;justify-content:center}
.opt .t{flex:1;min-width:0}.opt .t b{display:block;font-size:.78rem;font-weight:800;color:var(--ink)}.opt .t span{display:block;font-size:.66rem;color:var(--muted);margin-top:1px;font-weight:600}
.opt.rec{border-color:#bfe0cd;background:#f0f9f4}
.opt .tag{font-size:.56rem;font-weight:900;color:var(--green2);background:#e2f0e9;border:1px solid #cfe6da;border-radius:999px;padding:2px 7px;white-space:nowrap;flex:0 0 auto}
.ask .other{margin:4px 12px 12px;border-top:1px dashed #d9e4dd;padding-top:9px}
.ask .other .lbl{font-size:.68rem;font-weight:800;color:var(--muted);margin-bottom:6px}
.ask .other .row{display:flex;gap:7px}
.ask .other input{flex:1;height:34px;border:1.5px solid var(--line);border-radius:9px;padding:0 10px;font-family:inherit;font-size:.76rem;outline:none}
.ask .other input:focus{border-color:var(--gold)}
.ask .other button{height:34px;padding:0 13px;background:var(--green2);color:#fff;border:none;border-radius:9px;font-family:inherit;font-weight:900;font-size:.74rem;cursor:pointer}
@keyframes akb{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}
@keyframes akpp{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}

/* ===== المُدخل + المرفقات ===== */
.comp{border-top:1px solid var(--line);background:#fff;padding:9px;flex:0 0 auto}
.genchip{display:inline-flex;align-items:center;gap:6px;background:#fff4e2;border:1px solid #eddcbf;color:#a9752f;border-radius:999px;padding:4px 10px;font-size:.68rem;font-weight:800;margin-bottom:8px}
.genchip button{background:none;border:none;color:#a9752f;cursor:pointer;font-weight:900}
.atts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:9px}
#genchip:empty,.atts:empty{display:none}
.inrow{display:flex;align-items:center;gap:6px}
.att{position:relative;width:58px;height:58px;border-radius:11px;border:1px solid var(--line);overflow:hidden;cursor:pointer;background:#fff;flex:0 0 auto;transition:.14s;display:flex;align-items:center;justify-content:center}
.att:hover{border-color:var(--green3);transform:translateY(-2px);box-shadow:0 8px 18px rgba(15,23,42,.12)}
.att img{width:100%;height:100%;object-fit:cover;display:block}
.att svg.doc{width:38px;height:44px;display:block}
.att .nm{position:absolute;inset-inline:0;bottom:0;background:linear-gradient(0deg,rgba(0,0,0,.72),transparent);color:#fff;font-size:.5rem;font-weight:800;padding:9px 3px 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.att .x{position:absolute;top:3px;inset-inline-start:3px;width:17px;height:17px;border-radius:50%;background:rgba(17,24,39,.7);color:#fff;border:none;font-size:.6rem;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;z-index:2}
.att .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.05rem;text-shadow:0 1px 5px rgba(0,0,0,.6);pointer-events:none}
.att .badge{position:absolute;top:3px;inset-inline-end:3px;background:rgba(18,60,42,.85);color:#fff;font-size:.46rem;font-weight:900;border-radius:5px;padding:2px 4px}
.box{border:1.6px solid var(--line);border-radius:22px;background:#fff;padding:5px 7px;transition:.14s}
.box:focus-within{border-color:var(--gold);box-shadow:0 0 0 3px rgba(189,149,82,.12)}
.box textarea{flex:1;min-width:0;border:none;outline:none;resize:none;background:transparent;font-family:inherit;font-size:.85rem;line-height:1.5;color:var(--ink);height:24px;min-height:24px;max-height:132px;overflow-y:auto;display:block;padding:3px 4px}
.box textarea::placeholder{color:#9aa6b2}
.plus{width:32px;height:32px;flex:0 0 auto;border:none;background:#eef7f2;border-radius:50%;color:var(--green2);cursor:pointer;font-size:1.15rem;font-weight:700;display:flex;align-items:center;justify-content:center;transition:.14s}
.plus:hover{background:#e2f0e9}
.menuwrap{position:relative;flex:0 0 auto}
.pmenu{position:absolute;bottom:40px;inset-inline-start:0;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px rgba(15,23,42,.16);padding:5px;min-width:216px;display:none;z-index:25;max-height:300px;overflow-y:auto}
.menuwrap.open .pmenu{display:block}
.pmenu button{display:flex;align-items:center;gap:9px;width:100%;background:none;border:none;border-radius:9px;padding:9px 11px;font-family:inherit;font-size:.77rem;font-weight:800;color:var(--ink);cursor:pointer;text-align:right}
.pmenu button:hover{background:#f4f8f6}
.pmenu button svg{width:17px;height:17px;flex:0 0 auto;fill:none;stroke:var(--green2);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.pmenu .sub{font-size:.63rem;color:var(--muted);font-weight:700;display:block;margin-top:1px}
.pmenu .divi{height:1px;background:var(--line);margin:4px 6px}
.pmenu .ttl{font-size:.6rem;font-weight:900;color:var(--muted);padding:5px 11px 2px}
.send{flex:0 0 auto;width:36px;height:36px;border:none;border-radius:50%;background:linear-gradient(135deg,var(--green3),var(--green2));color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 5px 14px rgba(18,60,42,.3);transition:.15s}
.send:hover{transform:translateY(-1px);filter:brightness(1.05)}
.send:disabled{opacity:.5;cursor:default;transform:none}
.send svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.send.stop{background:#fdecea;color:#c0392b}
.send.stop svg{stroke:#c0392b;fill:#c0392b}
.hint{font-size:.57rem;color:var(--muted);text-align:center;margin-top:7px;font-weight:700}
.foot{text-align:center;padding:4px 0 6px}.foot a{font-size:.68rem;color:var(--muted);text-decoration:none}

/* زر النزول لأسفل */
.jump{position:absolute;inset-inline-end:14px;background:var(--green2);color:#fff;border:none;border-radius:999px;padding:7px 13px;font-family:inherit;font-size:.72rem;font-weight:900;cursor:pointer;box-shadow:0 8px 20px rgba(18,60,42,.3);display:none;align-items:center;gap:6px;z-index:14}
.jump.show{display:inline-flex}
.jump .n{background:#fff;color:var(--green2);border-radius:999px;min-width:17px;height:17px;font-size:.62rem;display:inline-flex;align-items:center;justify-content:center;padding:0 4px}

/* ===== تسجيل الدخول ===== */
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 6px 18px rgba(15,23,42,.05);margin:14px}
.card label{font-size:.8rem;font-weight:800;display:block;margin-bottom:6px}
.card input{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;font-size:.9rem;font-family:inherit}
.card input:focus{outline:none;border-color:var(--gold)}
.btn-primary{border:none;border-radius:11px;padding:12px;font-size:.9rem;font-weight:800;cursor:pointer;width:100%;background:var(--green);color:#fff}
.btn-primary:disabled{opacity:.55}
.lstatus{font-size:.8rem;font-weight:700;margin-top:10px;padding:9px 11px;border-radius:9px;display:none}
.lstatus.show{display:block}.lstatus.err{background:#fdecec;color:#c0392b}.lstatus.warn{background:#fff7e6;color:#9a6b00}

/* ===== المعاينة + المنتقي ===== */
.prev{position:fixed;inset:0;background:rgba(8,18,13,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:60}
.prev.show{display:flex}
.prev-box{background:#fff;border-radius:14px;max-width:520px;width:100%;height:min(80vh,700px);overflow:hidden;display:flex;flex-direction:column}
.prev-hd{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);font-weight:900;font-size:.85rem;color:var(--green)}
.prev-hd b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prev-hd button{background:#f3f6f9;border:1px solid var(--line);border-radius:8px;padding:6px 11px;font-family:inherit;font-weight:800;cursor:pointer}
.prev-bd{flex:1;min-height:0;background:#f6f8f6;display:flex;align-items:center;justify-content:center}
.prev-bd img,.prev-bd iframe,.prev-bd video{width:100%;height:100%;object-fit:contain;border:0;background:#fff}
.prev-bd audio{width:90%}
.prev-note{padding:18px;text-align:center;color:var(--muted);font-weight:800;font-size:.84rem;line-height:1.7}

.layer{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;z-index:55}
.layer.show{display:flex}
.layer .lhd{background:linear-gradient(135deg,#164733,var(--green));color:#fff;padding:11px 13px;display:flex;align-items:center;gap:9px;flex:0 0 auto}
.layer .lhd .back{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);color:#fff;border-radius:8px;padding:6px 11px;font-family:inherit;font-weight:800;font-size:.72rem;cursor:pointer}

</style>

<body>

<!-- ===== تسجيل الدخول ===== -->
<div id="loginView" class="card">
  <p style="font-weight:900;margin:0 0 4px;font-size:1rem;color:var(--green)">عون — الدخول</p>
  <p style="font-size:.74rem;color:var(--muted);margin:0 0 12px">مساعدك القانوني داخل Word · شركة عبدالله خالد الراشد</p>
  <label>اسم المستخدم</label>
  <input id="user" type="text" autocomplete="username"/>
  <label style="margin-top:10px">Application Password</label>

  <button id="loginBtn" class="btn-primary" style="margin-top:14px">دخول</button>

<!-- ===== التطبيق ===== -->
<div id="appView" class="hidden" style="flex:1;display:flex;flex-direction:column;min-height:0">
  <div class="top">
    <div class="lg"><img src="https://aklaw-sa.com/wp-content/uploads/aoun/aoun-ain.png" alt="ع" onerror="this.parentNode.textContent='ع'"></div>

          <button data-m="opus" class="on"><span class="k"></span><span>Opus <span class="sub">· الأقوى</span></span></button>
          <button data-m="sonnet"><span class="k"></span><span>Sonnet <span class="sub">· متوازن</span></span></button>

        </div>
      </div>
      <button class="hb" id="btnNew" title="محادثة جديدة" type="button"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>

      <div class="inrow">
        <div class="menuwrap" id="mw">
          <button class="plus" id="plusBtn" type="button">+</button>
          <div class="pmenu">
            <button data-act="file"><svg viewBox="0 0 24 24"><path d="M21 11.5l-8.5 8.5a5 5 0 0 1-7-7l8.5-8.5a3.3 3.3 0 0 1 4.7 4.7l-8.6 8.5a1.6 1.6 0 0 1-2.3-2.3l7.9-7.9"/></svg><span>إرفاق ملف من جهازك<span class="sub">صورة · PDF · Word · Excel · فيديو · صوت</span></span></button>
            <button data-act="case"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span>من مستندات القضايا<span class="sub">اختر من أرشيف القضية مباشرة</span></span></button>

        <textarea id="ta" placeholder="اكتب لعون أو أرفق مستنداً…"></textarea>

<!-- معاينة -->

  <div class="prev-box"><div class="prev-hd"><b id="pvt">معاينة</b><button id="pvClose" type="button">إغلاق</button></div><div class="prev-bd" id="pvb"></div></div>

  <div class="lhd"><button class="back" id="caseBack" type="button">‹ رجوع</button><div class="t"><b id="caseTitle">مستندات القضايا</b><span id="caseSub">اختر قضية لعرض مرفقاتها</span></div></div>
  <div class="lsearch"><input id="caseSearch" placeholder="ابحث باسم القضية أو الموكّل…"></div>

  <div class="lfoot"><span class="cnt">المحدد: <b id="caseCnt">٠</b></span><button class="add" id="caseAdd" type="button" disabled>➕ إضافة لعون</button></div>
</div>

<script>
var API="https://aklaw-sa.com/wp-json/ak/v1/";
function $(s){ return (s[0]==="#"||s[0]===".")?document.querySelector(s):document.getElementById(s); }
function token(){ return localStorage.getItem("ak_token")||""; }
function authH(extra){ var h={Authorization:"Basic "+token()}; if(extra) for(var k in extra) h[k]=extra[k]; return h; }
function esc(s){ return String(s||"").replace(/[&<>"]/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m];}); }
function nfmt(n){ n=+n||0; return n>=1000?(n/1000).toFixed(n>=10000?0:1)+'k':Math.round(n); }
function akSecs(ms){ var s=ms/1000; return (s<10?s.toFixed(1):Math.round(s))+' ث'; }

/* النماذج + التسعير + الأيقونات — مطابقة لعون بالمنصة */
var MODELS={opus:{id:'claude-opus-5',think:true},sonnet:{id:'claude-sonnet-5',think:true},haiku:{id:'claude-haiku-4-5',think:false}};
var AK_PRICE={'claude-opus-5':[5,25],'claude-sonnet-5':[3,15],'claude-haiku-4-5':[1,5]}, AK_SAR=3.75;
var AK_MLBL={'claude-opus-5':'Opus','claude-sonnet-5':'Sonnet','claude-haiku-4-5':'Haiku'};
function akCost(id,tin,tout){ var p=AK_PRICE[id]||AK_PRICE['claude-opus-5']; var sar=((tin*p[0]+tout*p[1])/1e6)*AK_SAR; return sar<0.01?'< 0.01 ر.س':sar.toFixed(2)+' ر.س'; }
var IC_CLOCK='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v4l3 2"/></svg>';
var IC_DOWN='<svg viewBox="0 0 24 24"><path d="M12 20V10"/><path d="M6 15l6 5 6-5"/></svg>';
var IC_UP='<svg viewBox="0 0 24 24"><path d="M12 4v10"/><path d="M6 9l6-5 6 5"/></svg>';
var IC_BOLT='<svg viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg>';
var IC_COIN='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15 9a3 3 0 0 0-3-2c-1.7 0-3 1-3 2.3 0 3 6 1.4 6 4.4 0 1.4-1.3 2.3-3 2.3a3 3 0 0 1-3-2"/></svg>';
var IC_CHIP='<svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M9 9h6v6H9z"/></svg>';
var ICON="https://aklaw-sa.com/wp-content/uploads/aoun/aoun-ain.png";

/* ===== Markdown → HTML (مطابقة لعون) ===== */
function mdToHtml(src){
  var s=(src||'').replace(/[&<>]/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[m];});
  s=s.replace(/`([^`]+)`/g,'<code>$1</code>');
  s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/__([^_]+)__/g,'<strong>$1</strong>');
  s=s.replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>');
  var lines=s.split(/\n/), html='', ul=false, ol=false, m;
  function close(){ if(ul){html+='</ul>';ul=false;} if(ol){html+='</ol>';ol=false;} }
  for(var i=0;i<lines.length;i++){ var line=lines[i].trim();
    if(line===''){ close(); continue; }
    if(m=line.match(/^(#{1,6})\s+(.*)$/)){ close(); var lv=Math.min(m[1].length+2,5); html+='<h'+lv+'>'+m[2]+'</h'+lv+'>'; continue; }
    if(m=line.match(/^>\s?(.*)$/)){ close(); html+='<blockquote>'+m[1]+'</blockquote>'; continue; }
    if(m=line.match(/^[-*•]\s+(.*)$/)){ if(!ul){close();html+='<ul>';ul=true;} html+='<li>'+m[1]+'</li>'; continue; }
    if(m=line.match(/^(\d+)[.)]\s+(.*)$/)){ if(!ol){close();html+='<ol>';ol=true;} html+='<li>'+m[2]+'</li>'; continue; }
    close(); html+='<p>'+line+'</p>';
  }
  close(); return html;
}
/* ===== Markdown → Word HTML (للإدراج في المستند — خطوط المكتب) ===== */
function mdInlineW(s){ s=esc(s); s=s.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/__([^_]+)__/g,"<strong>$1</strong>"); return s; }
function mdToWordHtml(text){
  var lines=String(text||"").replace(/\r/g,"").split("\n"), out="", firstH=true, list=null;
  var head="font-family:'Tajawal','Sakkal Majalla',Tahoma";
  var body="font-family:'Amiri','Traditional Arabic','Sakkal Majalla',Tahoma;direction:rtl;text-align:justify;font-size:15pt;line-height:1.6;color:#111111;margin:0 0 6pt";
  var liS="font-family:'Amiri','Traditional Arabic','Sakkal Majalla',Tahoma;direction:rtl;text-align:justify;font-size:15pt;line-height:1.6;color:#111111;margin:0 0 3pt";
  function flush(){ if(list){ out+='<'+list.type+' dir="rtl" style="margin:3pt 0 7pt;padding-right:24px">'+list.items.map(function(it){return '<li style="'+liS+'">'+mdInlineW(it)+'</li>';}).join("")+'</'+list.type+'>'; list=null; } }
  for(var i=0;i<lines.length;i++){ var ln=lines[i].trim(); if(ln===""){ flush(); continue; }
    var num=ln.match(/^(\d+)[\.\)]\s+(.+)$/), bul=ln.match(/^[\*\-•]\s+(.+)$/), hd=ln.match(/^#{1,6}\s*(.+)$/), bold=ln.match(/^\*\*(.+?)\*\*[:：]?\s*$/);
    if(num){ if(!list||list.type!=="ol"){ flush(); list={type:"ol",items:[]}; } list.items.push(num[2]); }
    else if(bul){ if(!list||list.type!=="ul"){ flush(); list={type:"ul",items:[]}; } list.items.push(bul[1]); }
    else if(hd||bold){ flush(); var htxt=(hd?hd[1]:bold[1]);
      out+= firstH ? '<p style="'+head+';direction:rtl;text-align:center;font-size:17pt;font-weight:bold;color:#111111;line-height:1.3;margin:0 0 9pt">'+mdInlineW(htxt)+'</p>'
                   : '<p style="'+head+';direction:rtl;text-align:right;font-size:15pt;font-weight:bold;color:#111111;line-height:1.3;margin:9pt 0 3pt">'+mdInlineW(htxt)+'</p>';
      firstH=false;
    } else { flush(); out+='<p style="'+body+'">'+mdInlineW(ln)+'</p>'; }
  }
  flush(); return out;
}

/* ===== أيقونة مستند ملوّنة بالامتداد ===== */
function fileSvg(ext,color){
  return '<svg class="doc" viewBox="0 0 32 40" xmlns="http://www.w3.org/2000/svg">'
    +'<path d="M4 1.5h15l9 9v26.5a2.5 2.5 0 0 1-2.5 2.5h-21A2.5 2.5 0 0 1 2 37V4A2.5 2.5 0 0 1 4.5 1.5z" fill="#fff" stroke="#dfe5ec" stroke-width="1"/>'
    +'<path d="M19 1.5l9 9h-6.5A2.5 2.5 0 0 1 19 8z" fill="#eef2f6"/>'
    +'<rect x="2" y="23" width="26" height="11" rx="2.5" fill="'+color+'"/>'
    +'<text x="15" y="31.3" text-anchor="middle" fill="#fff" font-size="7.2" font-weight="900" font-family="Tajawal,Arial">'+ext+'</text></svg>';
}
var COL={pdf:'#e0483b',doc:'#2b6cb0',docx:'#2b6cb0',xls:'#1f8a4c',xlsx:'#1f8a4c',ppt:'#d3542a',mp4:'#111827',mov:'#111827',mp3:'#7c3aed',wav:'#7c3aed',m4a:'#7c3aed',zip:'#c98a1a',txt:'#64748b'};
function attIcon(a){
  if((a.mime||'').indexOf('image/')===0 && a.url) return '<img src="'+a.url+'" alt="">';
  var ex=(a.ext||'').toUpperCase()||'FILE';
  var svg=fileSvg(ex.slice(0,4),COL[a.ext]||COL.txt);
  var media=a.media;
  return svg+(media?'<div class="play">▶</div>':'')+(media?'<div class="badge">تفريغ</div>':'');
}

/* ===== الحالة العامة ===== */
var conv=[], atts=[], genDoc=null, busy=false, aborter=null;
var chat, ta;
var akStick=true, akUnseen=0;

/* ===== المرفقات ===== */
function addFile(f){
  var mime=f.type||'application/octet-stream';
  var ext=(f.name.split('.').pop()||'').toLowerCase();
  var media=/^audio\//.test(mime)||/^video\//.test(mime)||['mp3','wav','m4a','mp4','mov','aac','ogg'].indexOf(ext)>=0;
  var url=URL.createObjectURL(f);
  var att={name:f.name,mime:mime,ext:ext,media:media,file:f,url:url,data:''};
  atts.push(att); renderChips();
  if(!media){ var rd=new FileReader(); rd.onload=function(){ att.data=String(rd.result).split(',')[1]||''; }; rd.readAsDataURL(f); }
}
function renderChips(){
  var g = genDoc ? '<span class="genchip">🖊️ توليد: '+esc(genDoc)+' <button data-gen="x" type="button">✕</button></span>' : '';
  $('genchip').innerHTML=g;
  $('atts').innerHTML=atts.map(function(a,i){
    return '<div class="att" data-pv="'+i+'">'+attIcon(a)+'<button class="x" data-x="'+i+'" type="button">✕</button><div class="nm">'+esc(a.name)+'</div></div>';
  }).join('');
  $('atts').querySelectorAll('[data-x]').forEach(function(b){ b.onclick=function(e){ e.stopPropagation(); atts.splice(+this.dataset.x,1); renderChips(); }; });
  $('atts').querySelectorAll('[data-pv]').forEach(function(d){ d.onclick=function(){ previewAtt(atts[+this.dataset.pv]); }; });
  var gx=$('genchip').querySelector('[data-gen]'); if(gx) gx.onclick=function(){ genDoc=null; renderChips(); };
}
function previewAtt(a){
  if(!a) return; var b=$('pvb'); $('pvt').textContent=a.name; b.innerHTML='';
  if((a.mime||'').indexOf('image/')===0) b.innerHTML='<img src="'+a.url+'">';
  else if(a.mime==='application/pdf'||a.ext==='pdf') b.innerHTML='<iframe src="'+a.url+'"></iframe>';
  else if(/^audio\//.test(a.mime)) b.innerHTML='<audio controls src="'+a.url+'"></audio>';
  else if(/^video\//.test(a.mime)) b.innerHTML='<video controls src="'+a.url+'"></video>';
  else b.innerHTML='<div class="prev-note">لا معاينة مباشرة لهذا النوع — سيُقرأ محتواه عند الإرسال لعون.</div>';
  $('prev').classList.add('show');
}

/* ===== تمرير ذكي ===== */
function akAtBottom(){ return chat.scrollHeight - chat.scrollTop - chat.clientHeight < 60; }
function akToBottom(){ akStick=true; akUnseen=0; var j=$('jump'); j.classList.remove('show'); $('jn').textContent=''; chat.scrollTop=chat.scrollHeight; }
function follow(){ var j=$('jump');
  if(akStick){ chat.scrollTop=chat.scrollHeight; }
  else { akUnseen++; $('jn').textContent=akUnseen; j.classList.add('show'); }
}

/* ===== الفقاعات ===== */
function welcomeOff(){ var w=$('#ak-welcome'); if(w) w.remove(); }
function addBub(who,text,attNames){
  welcomeOff();
  var row=document.createElement('div'); row.className='msg '+who;
  var av=document.createElement('div'); av.className='av';
  if(who==='a'){ av.innerHTML='<img src="'+ICON+'" alt="ع" onerror="this.parentNode.textContent=\'ع\'">'; } else { av.textContent='أنت'; }
  var bub=document.createElement('div'); bub.className='bub';
  if(attNames&&attNames.length){ var a=document.createElement('div'); a.className='atts'; a.style.margin='0 0 7px';
    a.innerHTML=attNames.map(function(x){return '<span class="att-mini">📎 '+esc(x)+'</span>';}).join(''); bub.appendChild(a); }
  var tx=document.createElement('div');
  if(who==='a' && text){ tx.className='tx md'; tx.innerHTML=mdToHtml(text); } else { tx.className='tx'; tx.textContent=text||''; }
  bub.appendChild(tx);
  if(who==='a' && text) addActions(bub,text,tx);
  row.appendChild(av); row.appendChild(bub); chat.appendChild(row);
  chat.scrollTop=chat.scrollHeight; return {bub:bub,tx:tx};
}
function makeThink(text){
  var t=document.createElement('div'); t.className='think';
  t.innerHTML='<div class="th-head"><span class="th-ic"><svg viewBox="0 0 24 24"><path d="M9 3a3 3 0 0 0-3 3 3 3 0 0 0-2 5 3 3 0 0 0 2 5 3 3 0 0 0 6 0V6a3 3 0 0 0-3-3z"/><path d="M15 3a3 3 0 0 1 3 3 3 3 0 0 1 2 5 3 3 0 0 1-2 5 3 3 0 0 1-6 0"/></svg></span><span class="th-title">تفكير عون</span><span class="th-chev">‹</span></div><div class="th-body"></div>';
  t.querySelector('.th-body').textContent=text||'';
  t.querySelector('.th-head').onclick=function(){ t.classList.toggle('open'); };
  return t;
}
function makeStats(s){
  if(!s) return null;
  var el=s.ms||0, spd=el>300?nfmt((s.tout||0)/(el/1000)):'0';
  var akm=document.createElement('div'); akm.className='akm';
  akm.innerHTML='<span class="it">'+IC_CLOCK+'الوقت <b>'+akSecs(el)+'</b></span>'

var ASK_RE=/⟦ASK⟧([\s\S]*?)⟦\/ASK⟧/;
function stripAsk(t){ return (t||'').replace(ASK_RE,'').replace(/⟦ASK⟧[\s\S]*$/,'').trim(); }
function parseAsk(t){ var m=(t||'').match(ASK_RE); if(!m) return null;
  try{ var o=JSON.parse(m[1].trim()); if(o&&o.q&&Array.isArray(o.options)&&o.options.length) return o; }catch(e){} return null; }

    return '<button class="opt'+rec+'" data-v="'+esc(o.t)+'"><span class="n">'+(i+1)+'</span><span class="t"><b>'+esc(o.t)+'</b>'+d+'</span>'+tag+'</button>';
  }).join('');
  box.innerHTML='<div class="ask-h"><span class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.8.4-1 .9-1 1.7"/><path d="M12 17h.01"/></svg></span><b>'+esc(ask.q)+'</b></div>'
    +'<div class="ask-opts">'+opts+'</div>'
    +'<div class="other"><div class="lbl">أو أخرى — اكتب إجابتك:</div><div class="row"><input placeholder="اكتب إجابتك هنا…"><button type="button">إرسال</button></div></div>';
  function choose(v){ if(busy||!v) return; box.querySelectorAll('.opt').forEach(function(b){b.disabled=true;}); ta.value=v; send(); }
  box.querySelectorAll('.opt').forEach(function(b){ b.onclick=function(){ choose(this.dataset.v); }; });
  var oi=box.querySelector('.other input'), ob=box.querySelector('.other button');

/* ===== تفريغ الصوت/الفيديو عبر Gemini (مباشرة من المتصفح) ===== */
function sleep(ms){ return new Promise(function(r){ setTimeout(r,ms); }); }
async function geminiTranscribe(att,key,statusCb){
  if(!key) return ''; var f=att.file; if(!f) return '';
  statusCb('جارٍ رفع «'+att.name+'» إلى Gemini…');
  var start=await fetch('https://generativelanguage.googleapis.com/upload/v1beta/files?key='+encodeURIComponent(key),{method:'POST',headers:{'X-Goog-Upload-Protocol':'resumable','X-Goog-Upload-Command':'start','X-Goog-Upload-Header-Content-Length':String(f.size),'X-Goog-Upload-Header-Content-Type':att.mime,'Content-Type':'application/json'},body:JSON.stringify({file:{display_name:att.name}})});
  var upUrl=start.headers.get('X-Goog-Upload-URL'); if(!upUrl) return '';
  var up=await fetch(upUrl,{method:'POST',headers:{'X-Goog-Upload-Command':'upload, finalize','X-Goog-Upload-Offset':'0'},body:f}).then(function(r){return r.json();});
  var nm=up.file&&up.file.name, uri=up.file&&up.file.uri, state=(up.file&&up.file.state)||'ACTIVE';
  if(!uri) return ''; var tries=0;
  while(state==='PROCESSING' && tries<200){ statusCb('جارٍ معالجة التسجيل في Gemini…'); await sleep(3000); tries++;
    var g=await fetch('https://generativelanguage.googleapis.com/v1beta/'+nm+'?key='+encodeURIComponent(key)).then(function(r){return r.json();}).catch(function(){return {};}); state=g.state||'ACTIVE'; }
  if(state==='FAILED') return '';
  statusCb('جارٍ تفريغ التسجيل عبر Gemini…');
  var TP='فرّغ محتوى هذا الملف الصوتي/المرئي كاملاً من أوله إلى آخره دون اختصار أو حذف، نصاً عربياً متواصلاً في فقرة واحدة، مع الإشارة للمتحدث بصيغة «اسم المتحدث: كلامه.» بلا ذكر التوقيت أو الثواني. أخرِج النصّ المفرّغ فقط.';
  var gg=await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key='+encodeURIComponent(key),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{role:'user',parts:[{file_data:{mime_type:att.mime,file_uri:uri}},{text:TP}]}],generationConfig:{temperature:0.2,maxOutputTokens:40000}})}).then(function(r){return r.json();}).catch(function(){return {};});
  var parts=(gg.candidates&&gg.candidates[0]&&gg.candidates[0].content&&gg.candidates[0].content.parts)||[];
  return parts.map(function(p){return p.text||'';}).join('').trim();
}

/* ===== الإرسال + البثّ المباشر من Claude ===== */
async function send(){
  if(busy) return;
  var text=ta.value.trim();
  var gen=!!genDoc, dtype=genDoc||'';
  if(!text && !atts.length && !gen) return;
  var totB64=atts.reduce(function(s,a){ return s+((a.data&&!a.media)?a.data.length:0); },0);
  if(totB64>30*1024*1024){ alert('المستندات المرفقة (غير التسجيلات) مجتمعةً تتجاوز حدّ Claude (~٣٢ م.ب للرسالة). قلّل عددها أو أحجامها، أو أرسلها على دفعات.'); return; }
  var attNames=atts.map(function(a){return a.name;});
  addBub('u', text||'(توليد مستند)', attNames);
  conv.push({role:'user', text:text, atts:attNames});
  var sendAtts=atts.slice(); atts=[]; genDoc=null; renderChips();
  ta.value=''; ta.style.height='auto';

  busy=true; aborter=new AbortController(); akSendBtn(true);
  akToBottom();
  var t0=performance.now();
  var out=addBub('a',''); out.tx.innerHTML='<span class="typing"><i></i><i></i><i></i></span>';
  var usageIn=0, usageOut=0;
  var liveEl=document.createElement('div'); liveEl.className='aklive';
  liveEl.innerHTML='<span class="ld"></span><span class="lb">عون يعمل…</span><span class="lv"></span><span class="m">'+IC_CLOCK+'<b class="lt">0.0</b> ث</span><span class="m">'+IC_UP+'<b class="lk">0</b> توكِن</span><span class="m">'+IC_BOLT+'<b class="ls">0</b>/ث</span>';
  var liveT=liveEl.querySelector('.lt'), liveK=liveEl.querySelector('.lk'), liveS=liveEl.querySelector('.ls');
  var liveTimer=setInterval(function(){ var s=(performance.now()-t0)/1000; liveT.textContent=s<10?s.toFixed(1):Math.round(s); liveK.textContent=nfmt(usageOut); liveS.textContent=s>0.3?nfmt(usageOut/s):'0'; },250);
  var think=document.createElement('div'); think.className='think open'; think.style.display='none';
  think.innerHTML='<div class="th-head"><span class="th-ic"><svg viewBox="0 0 24 24"><path d="M9 3a3 3 0 0 0-3 3 3 3 0 0 0-2 5 3 3 0 0 0 2 5 3 3 0 0 0 6 0V6a3 3 0 0 0-3-3z"/><path d="M15 3a3 3 0 0 1 3 3 3 3 0 0 1 2 5 3 3 0 0 1-2 5 3 3 0 0 1-6 0"/></svg></span><span class="th-title">عون يفكّر</span><span class="th-dots"><i></i><i></i><i></i></span><span class="th-chev" style="display:none">‹</span></div><div class="th-body"></div>';
  out.bub.insertBefore(think, out.tx);
  out.bub.appendChild(liveEl);
  var thTitle=think.querySelector('.th-title'), thBody=think.querySelector('.th-body'), thDots=think.querySelector('.th-dots'), thChev=think.querySelector('.th-chev');
  think.querySelector('.th-head').onclick=function(){ think.classList.toggle('open'); };
  var errored=false, answerStarted=false, answer='', thinkTxt='', stopReason='', stopped=false;
  function setStatus(s){ if(!answerStarted){ out.tx.className='tx'; out.tx.innerHTML='<span class="status">'+esc(s)+'</span> <span class="typing"><i></i><i></i><i></i></span>'; } }
  try{
    setStatus('يجهّز عون…');
    var prep=await fetch(API+'aoun/prep',{method:'POST',headers:authH({'Content-Type':'application/json'}),
      body:JSON.stringify({messages:conv.map(function(m){return {role:m.role,text:m.text};}),doc_type:dtype})}).then(function(r){
        if(r.status===401){ localStorage.removeItem('ak_token'); location.reload(); throw new Error('انتهت الجلسة'); }
        return r.json(); });
    if(!prep||!prep.claude_key) throw new Error('تعذّر تجهيز عون');

    var ublocks=[];
    for(var ai=0; ai<sendAtts.length; ai++){ var a=sendAtts[ai];
      if(a.media){
        var tr=await geminiTranscribe(a,prep.gemini_key,setStatus);
        ublocks.push({type:'text',text:'التفريغ النصّي الكامل للتسجيل «'+a.name+'» (فُرّغ عبر Gemini — راجعه):\n\n'+(tr||'(تعذّر التفريغ)')});
      } else if((a.mime||'').indexOf('image/')===0){
        ublocks.push({type:'image',source:{type:'base64',media_type:a.mime,data:a.data}});
      } else if(a.mime==='application/pdf'||a.ext==='pdf'){
        ublocks.push({type:'document',source:{type:'base64',media_type:'application/pdf',data:a.data}});
      } else if(['doc','docx','xls','xlsx'].indexOf(a.ext)>=0||/word|excel|spreadsheet|officedocument/.test(a.mime||'')){
        setStatus('يقرأ «'+a.name+'»…');
        var ex=await fetch(API+'aoun/extract',{method:'POST',headers:authH({'Content-Type':'application/json'}),body:JSON.stringify({mime:a.mime,data:a.data})}).then(function(r){return r.json();}).catch(function(){return {};});
        if(ex&&ex.text) ublocks.push({type:'text',text:'محتوى المرفق «'+a.name+'»:\n'+ex.text});
      } else if(a.data){
        try{ ublocks.push({type:'text',text:'محتوى المرفق «'+a.name+'»:\n'+decodeURIComponent(escape(atob(a.data))).slice(0,60000)}); }catch(e){}
      }
    }
    if(text) ublocks.push({type:'text',text:text});
    if(!ublocks.length) ublocks.push({type:'text',text:' '});

    var cmsgs=[], n=conv.length;
    conv.forEach(function(m,i){ var role=m.role==='model'?'assistant':'user';
      if(i===n-1 && role==='user') cmsgs.push({role:'user',content:ublocks});
      else cmsgs.push({role:role,content:[{type:'text',text:m.text||' '}]}); });
    if(gen){ var dt=dtype||'المستند القانوني المطلوب'; cmsgs.push({role:'user',content:[{type:'text',text:'بناءً على كل ما سبق وعلى المرفقات، اكتب الآن «'+dt+'» كاملةً وجاهزةً للاستخدام، بأسلوب المكتب، نصاً عادياً فقط بلا تعليقات.'}]}); }

    var mcfg=MODELS[$('ak-model').value]||MODELS.opus;
    var body={model:mcfg.id,max_tokens:gen?96000:64000,system:prep.system,messages:cmsgs,stream:true};
    if(mcfg.think){ body.thinking={type:'adaptive',display:'summarized'}; body.output_config={effort:gen?'xhigh':'high'}; }
    setStatus('عون يفكّر…');
    var res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',
      headers:{'x-api-key':prep.claude_key,'anthropic-version':'2023-06-01','content-type':'application/json','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify(body), signal:aborter.signal});
    if(!res.body){ var tt=await res.text(); throw new Error('Claude '+res.status+': '+tt.slice(0,180)); }
    var rd=res.body.getReader(), dec=new TextDecoder(), buf='';
    while(true){ var r=await rd.read(); if(r.done) break;
      buf+=dec.decode(r.value,{stream:true}); var ix;
      while((ix=buf.indexOf('\n'))>=0){ var line=buf.slice(0,ix).trim(); buf=buf.slice(ix+1);
        if(!line||line.indexOf('data:')!==0) continue;
        var js=line.slice(5).trim(); if(!js||js==='[DONE]') continue;
        var ev; try{ ev=JSON.parse(js); }catch(e){ continue; }
        if(ev.type==='message_start'&&ev.message&&ev.message.usage){ var u=ev.message.usage;
          usageIn=(u.input_tokens||0)+(u.cache_read_input_tokens||0)+(u.cache_creation_input_tokens||0);
          if(u.output_tokens!=null) usageOut=u.output_tokens;
        } else if(ev.type==='content_block_delta'&&ev.delta){
          if(ev.delta.type==='text_delta'){ answer+=ev.delta.text;
            if(!answerStarted){ answerStarted=true; thTitle.textContent='تفكير عون'; thDots.style.display='none'; thChev.style.display=''; think.classList.remove('open'); }
            out.tx.className='tx md'; out.tx.innerHTML=mdToHtml(stripAsk(answer)); }
          else if(ev.delta.type==='thinking_delta'){ thinkTxt+=(ev.delta.thinking||''); think.style.display='block'; thBody.textContent=thinkTxt; if(!answerStarted) thBody.scrollTop=thBody.scrollHeight; }
        } else if(ev.type==='message_delta'){ if(ev.usage&&ev.usage.output_tokens!=null) usageOut=ev.usage.output_tokens; if(ev.delta&&ev.delta.stop_reason) stopReason=ev.delta.stop_reason;
        } else if(ev.type==='error'){ errored=true; out.bub.classList.add('err'); out.tx.className='tx'; out.tx.textContent=(ev.error&&ev.error.message)||'خطأ من Claude'; }
        follow();
      }
    }
  }catch(e){ if(e&&e.name==='AbortError'){ stopped=true; } else { errored=true; out.tx.className='tx'; out.tx.textContent='تعذّر الاتصال: '+(e&&e.message||e); } }
  clearInterval(liveTimer); if(liveEl) liveEl.remove();
  if(errored || !thinkTxt) think.remove();
  var finalBody=(answer||'').trim();
  if(!errored && finalBody){
    var cut = stopReason==='max_tokens';
    var ask = parseAsk(finalBody);
    var shown = stripAsk(finalBody) || (ask? '' : finalBody);
    out.tx.className='tx md'; out.tx.innerHTML=mdToHtml(shown + (cut?'\n\n— ⚠️ وصل حدّ الطول قبل اكتمال النصّ. اكتب «أكمل» لمتابعة الكتابة.':''));
    var mSel=(MODELS[$('ak-model').value]||MODELS.opus);
    var stats={ms:(performance.now()-t0), tin:usageIn, tout:usageOut, mid:mSel.id, cut:cut, think:!!mSel.think};
    conv.push({role:'model', text:shown, think:((thinkTxt||'').trim().slice(0,12000))||null, stats:stats});
    if(shown) addActions(out.bub, shown, out.tx);
    if(stopped){ var sc=document.createElement('div'); sc.className='ak-stopchip'; sc.innerHTML='<svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg> أُوقف الرد — تقدر تطلب الإكمال أو ترسل أمراً جديداً'; out.tx.appendChild(sc); }
    persist();
    if(ask) renderAsk(out.bub, ask);
    var akm=makeStats(stats); if(akm) out.bub.appendChild(akm);
  } else if(!errored){ out.tx.className='tx';
    out.tx.textContent = stopped ? 'أوقفت الطلب قبل بدء الرد.' : ((stopReason==='max_tokens') ? 'استهلك التفكير مساحة الطول قبل كتابة الإجابة — أعد المحاولة أو استخدم «توليد مستند» للمستندات الطويلة.' : 'لم يصل ردّ.');
  }
  busy=false; aborter=null; akSendBtn(false); ta.focus();
}

/* ===== سجل المحادثات (localStorage) ===== */
var LS='ak_aoun_word_convos', store=[], curId=null;
function loadAll(){ try{ return JSON.parse(localStorage.getItem(LS)||'[]'); }catch(e){ return []; } }
function saveAll(a){ try{ localStorage.setItem(LS,JSON.stringify(a.slice(0,40))); }catch(e){ try{ localStorage.setItem(LS,JSON.stringify(a.slice(0,12))); }catch(_){} } }
function persist(){ if(!conv.length) return;
  var title=(conv[0]&&conv[0].text||'محادثة').slice(0,42);
  var c=store.filter(function(x){return x.id===curId;})[0];
  if(c){ c.conv=conv; c.title=title; } else { curId=Date.now()+''; store.unshift({id:curId,title:title,conv:conv.slice()}); }
  saveAll(store); renderHist();
}
function renderHist(){
  var w=$('histpanel');

  w.innerHTML=store.map(function(c){ return '<button class="hitem '+(c.id===curId?'on':'')+'" data-id="'+c.id+'"><span>'+esc(c.title||'محادثة')+'</span><span class="del" data-del="'+c.id+'">🗑</span></button>'; }).join('');
}
function redraw(){
  chat.innerHTML='';

    if(m.role==='model'){ if(m.think) o.bub.insertBefore(makeThink(m.think), o.tx); if(m.stats){ var s=makeStats(m.stats); if(s) o.bub.appendChild(s); } }

}

/* ===== إدراج / أسلوب / ورق رسمي (ربط Office — محفوظ) ===== */
function insertToWord(text){
  Word.run(function(ctx){ ctx.document.getSelection().insertHtml(mdToWordHtml(text), Word.InsertLocation.replace); return ctx.sync(); }).catch(function(){});
}
function styleSelection(){
  Word.run(function(ctx){ var sel=ctx.document.getSelection(); sel.load('text');
    return ctx.sync().then(function(){
      var text=(sel.text||'').trim();
      if(!text){ alert('حدّد نصاً في المستند أولاً'); return; }
      if(busy) return;
      var out=addBub('u','أعد صياغة النص المحدد بأسلوبي.');
      conv.push({role:'user',text:'أعد صياغة النص المحدد بأسلوبي.'});
      var a=addBub('a',''); a.tx.innerHTML='<span class="status">يعيد صياغة النص المحدد…</span> <span class="typing"><i></i><i></i><i></i></span>';
      busy=true; akSendBtn(true);
      return fetch(API+'style',{method:'POST',headers:authH({'Content-Type':'application/json'}),body:JSON.stringify({text:text})})
        .then(function(r){ return r.ok?r.json():r.json().then(function(d){ throw new Error(d.message||'خطأ'); }); })
        .then(function(d){
          a.tx.className='tx md'; a.tx.innerHTML=mdToHtml(d.text); addActions(a.bub,d.text,a.tx);
          conv.push({role:'model',text:d.text}); persist();
          busy=false; akSendBtn(false);

        })
        .catch(function(err){ a.tx.className='tx'; a.tx.textContent='⚠️ '+((err&&err.message)||'تعذّرت'); busy=false; akSendBtn(false); });
    });
  }).catch(function(){ busy=false; akSendBtn(false); });
}
function loadB64(url){ return fetch(url,{cache:'no-store'}).then(function(r){return r.blob();}).then(function(b){ return new Promise(function(res,rej){ var rd=new FileReader(); rd.onload=function(){ res(String(rd.result).split(',')[1]); }; rd.onerror=rej; rd.readAsDataURL(b); }); }); }
function applyLetterhead(){
  var dir=location.href.replace(/[^/]*$/,'');
  Promise.all([loadB64(dir+'letterhead-head.png'),loadB64(dir+'letterhead-foot.png')]).then(function(im){
    var hHtml='<table border="0" cellpadding="0" cellspacing="0" style="width:100%;border-collapse:collapse;margin:0"><tr><td style="padding:0;border:none;width:100%"><img src="data:image/png;base64,'+im[0]+'" style="width:100%"/></td></tr></table>';
    var fHtml='<table border="0" cellpadding="0" cellspacing="0" style="width:100%;border-collapse:collapse;margin:0"><tr><td style="padding:0;border:none;width:100%"><img src="data:image/png;base64,'+im[1]+'" style="width:100%"/></td></tr></table>';
    return Word.run(function(ctx){ var sec=ctx.document.sections.getFirst();
      var h=sec.getHeader(Word.HeaderFooterType.primary); h.clear(); h.insertHtml(hHtml,Word.InsertLocation.replace);
      var f=sec.getFooter(Word.HeaderFooterType.primary); f.clear(); f.insertHtml(fHtml,Word.InsertLocation.replace);
      return ctx.sync(); });
  }).then(function(){ alert('✓ طُبّق الورق الرسمي على المستند'); })
    .catch(function(e){ alert('تعذّر تطبيق الورق: '+(e&&e.message?e.message:JSON.stringify(e))); });
}

/* ===== منتقي مستندات القضايا ===== */
var caseState={cases:[],view:'cases',caseId:null,caseName:'',atts:[],sel:{},folders:[],fById:{},attFolder:{},path:[],cur:0};
function folderSvg(){ return '<svg class="doc" viewBox="0 0 24 24" style="width:26px;height:26px" fill="currentColor"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>'; }
function effParent(f){ var pid=+(f.parent_id||0); return (pid && caseState.fById[pid])?pid:0; }
function folderOfAtt(a){ var fid=caseState.attFolder[a.id]; fid=(fid!=null)?+fid:0; return (fid && caseState.fById[fid])?fid:0; }
function collectFolderFiles(fid,seen){ seen=seen||{}; if(seen[fid]) return []; seen[fid]=1;
  var out=caseState.atts.filter(function(a){return folderOfAtt(a)===fid;});
  caseState.folders.filter(function(f){return effParent(f)===fid;}).forEach(function(sf){ out=out.concat(collectFolderFiles(+sf.id,seen)); });
  return out; }
function folderSelState(fid){ var files=collectFolderFiles(fid); if(!files.length) return 'none';
  var s=files.filter(function(a){return caseState.sel[a.id];}).length; return s===0?'none':(s===files.length?'all':'some'); }
function toggleFolderSel(fid){ var files=collectFolderFiles(fid); if(!files.length) return;
  if(folderSelState(fid)==='all'){ files.forEach(function(a){ delete caseState.sel[a.id]; }); }
  else { files.forEach(function(a){ caseState.sel[a.id]=a; }); } }
function openCasePicker(){
  $('caseLayer').classList.add('show'); caseState.view='cases'; caseState.sel={};
  $('caseTitle').textContent='مستندات القضايا'; $('caseSub').textContent='اختر قضية لعرض مرفقاتها';
  $('caseSearch').value=''; $('caseSearch').placeholder='ابحث باسم القضية أو الموكّل…';
  $('caseAdd').disabled=true; $('caseCnt').textContent='٠';
  loadCases('');
}
function loadCases(q){
  $('caseList').innerHTML='<div class="lmsg">جارٍ تحميل القضايا…</div>';
  fetch(API+'cases'+(q?('?search='+encodeURIComponent(q)):''),{headers:authH()})
    .then(function(r){ if(r.status===401){ localStorage.removeItem('ak_token'); location.reload(); throw 0; } return r.json(); })
    .then(function(list){ caseState.cases=Array.isArray(list)?list:[]; renderCases(); })
    .catch(function(){ $('caseList').innerHTML='<div class="lmsg">تعذّر تحميل القضايا. تأكد من صلاحيتك أو أعد المحاولة.</div>'; });
}
function renderCases(){
  var list=caseState.cases;
  if(!list.length){ $('caseList').innerHTML='<div class="lmsg">لا توجد قضايا مطابقة.</div>'; return; }
  $('caseList').innerHTML=list.map(function(c,i){
    return '<button class="citem" data-i="'+i+'"><span class="ic">'+fileSvg('QID','#bd9552').replace('class="doc"','class="doc" style="width:26px;height:30px"')+'</span>'
      +'<span class="m"><b>'+esc(c.name||'قضية')+'</b><span>'+esc(c.partner||'')+' · '+(c.attachments_count||0)+' مرفق</span></span><span class="chev">‹</span></button>';
  }).join('');
  $('caseList').querySelectorAll('.citem').forEach(function(b){ b.onclick=function(){ openCase(caseState.cases[+this.dataset.i]); }; });
}
function openCase(c){
  caseState.view='atts'; caseState.caseId=c.id; caseState.caseName=c.name; caseState.sel={};
  caseState.folders=[]; caseState.fById={}; caseState.attFolder={}; caseState.path=[]; caseState.cur=0;
  $('caseTitle').textContent='مرفقات القضية'; $('caseSub').textContent=c.name+' — '+(c.partner||'');
  $('caseSearch').value=''; $('caseSearch').placeholder='ابحث باسم الملف…';
  $('caseAdd').disabled=true; $('caseCnt').textContent='٠';
  $('caseList').innerHTML='<div class="lmsg">جارٍ تحميل المرفقات والمجلدات…</div>';
  Promise.all([
    fetch(API+'cases/attachments?quote_id='+encodeURIComponent(c.id),{headers:authH()}).then(function(r){return r.json();}).catch(function(){return [];}),
    fetch(API+'aoun/case_folders?quote_id='+encodeURIComponent(c.id),{headers:authH()}).then(function(r){return r.json();}).catch(function(){return {};})
  ]).then(function(res){
    caseState.atts=Array.isArray(res[0])?res[0]:[];
    var fd=res[1]||{}; caseState.folders=Array.isArray(fd.folders)?fd.folders:[];
    caseState.attFolder=(fd.attFolder&&typeof fd.attFolder==='object')?fd.attFolder:{};
    caseState.fById={}; caseState.folders.forEach(function(f){ caseState.fById[+f.id]=f; });
    renderCaseLevel();
  }).catch(function(){ $('caseList').innerHTML='<div class="lmsg">تعذّر تحميل المرفقات.</div>'; });
}
function fileItemHtml(a,folderName){
  var ext=(String(a.name||'').split('.').pop()||'').toLowerCase();
  var isImg=(a.mimetype||'').indexOf('image/')===0;
  var ic=isImg?'<span class="ic">'+fileSvg('IMG','#25935f')+'</span>':'<span class="ic">'+fileSvg((ext.toUpperCase()).slice(0,4)||'FILE',COL[ext]||'#64748b')+'</span>';
  var kb=a.file_size?Math.max(1,Math.round(a.file_size/1024))+' ك.ب':'';
  var meta=kb+(folderName?(kb?' · ':'')+'📁 '+esc(folderName):'')+(a.create_date?' · '+a.create_date:'');
  return '<div class="citem'+(caseState.sel[a.id]?' sel':'')+'" data-id="'+a.id+'">'+ic
    +'<span class="m"><b>'+esc(a.name)+'</b><span>'+meta+'</span></span>'
    +'<span class="ck">'+(caseState.sel[a.id]?'✓':'')+'</span></div>';
}
function wireFileClicks(){
  $('caseList').querySelectorAll('.citem[data-id]').forEach(function(d){ d.onclick=function(){
    var id=this.dataset.id; if(caseState.sel[id]) delete caseState.sel[id]; else caseState.sel[id]=caseState.atts.filter(function(x){return String(x.id)===String(id);})[0];
    var q=$('caseSearch').value.trim(); if(q) renderCaseSearch(q); else renderCaseLevel(); updateCaseCnt();
  }; });
}
function folderCount(fid){
  var subs=caseState.folders.filter(function(f){return effParent(f)===fid;}).length;
  var files=caseState.atts.filter(function(a){return folderOfAtt(a)===fid;}).length;
  return subs+files;
}
function renderCaseLevel(){
  var cur=caseState.cur;
  var subs=caseState.folders.filter(function(f){return effParent(f)===cur;});
  var files=caseState.atts.filter(function(a){return folderOfAtt(a)===cur;});
  /* المسار */
  var crumb='<a data-c="0">📁 الجذر</a>';
  caseState.path.forEach(function(p,i){ crumb+=' › <a data-c="'+p.id+'">'+esc(p.name)+'</a>'; });
  var html=(cur!==0||caseState.path.length)?'<div class="crumbrow">'+crumb+'</div>':'';
  if(!subs.length&&!files.length){ html+='<div class="lmsg">هذا المجلد فارغ.</div>'; }
  if(subs.length){ html+='<div class="sec">المجلدات</div>'+subs.map(function(f){
    var rf=collectFolderFiles(+f.id).length, st=folderSelState(+f.id);
    var meta=folderCount(+f.id)+' عنصر'+(rf?(' · '+rf+' ملف'):'');
    var ck=rf?'<span class="ck fck '+st+'" data-fsel="'+f.id+'" title="حدّد المجلد كامل">'+(st==='all'?'✓':(st==='some'?'–':''))+'</span>':'<span class="cnt">'+folderCount(+f.id)+'</span>';
    return '<div class="citem folder'+(st==='all'?' selall':'')+'" data-f="'+f.id+'" data-fn="'+esc(f.name)+'"><span class="ic">'+folderSvg()+'</span><span class="m"><b>'+esc(f.name)+'</b><span>'+meta+'</span></span>'+ck+'</div>';
  }).join(''); }
  if(files.length){ html+='<div class="sec">الملفات</div>'+files.map(function(a){ return fileItemHtml(a,''); }).join(''); }
  $('caseList').innerHTML=html;
  $('caseList').querySelectorAll('.crumbrow a').forEach(function(a){ a.onclick=function(){
    var id=+this.dataset.c; if(id===0){ caseState.path=[]; caseState.cur=0; }
    else { var idx=caseState.path.map(function(p){return p.id;}).indexOf(id); if(idx>=0) caseState.path=caseState.path.slice(0,idx+1); caseState.cur=id; }
    renderCaseLevel();
  }; });
  $('caseList').querySelectorAll('.citem.folder').forEach(function(d){ d.onclick=function(e){
    if(e.target.closest('[data-fsel]')) return;
    caseState.path.push({id:+this.dataset.f,name:this.dataset.fn}); caseState.cur=+this.dataset.f; renderCaseLevel();
  }; });
  $('caseList').querySelectorAll('[data-fsel]').forEach(function(b){ b.onclick=function(e){ e.stopPropagation();
    toggleFolderSel(+this.dataset.fsel); renderCaseLevel(); updateCaseCnt();
  }; });
  wireFileClicks();
}
function renderCaseSearch(q){
  var list=caseState.atts.filter(function(a){ return (a.name||'').indexOf(q)>=0; });
  if(!list.length){ $('caseList').innerHTML='<div class="lmsg">لا ملفات مطابقة.</div>'; return; }
  $('caseList').innerHTML='<div class="sec">نتائج البحث ('+list.length+')</div>'+list.map(function(a){
    var fid=folderOfAtt(a); var fn=(fid&&caseState.fById[fid])?caseState.fById[fid].name:'';
    return fileItemHtml(a,fn);
  }).join('');
  wireFileClicks();
}
function updateCaseCnt(){ var n=Object.keys(caseState.sel).length; $('caseCnt').textContent=n?String(n):'٠'; $('caseAdd').disabled=!n; }
function addCaseSelection(){
  var picked=Object.keys(caseState.sel).map(function(k){return caseState.sel[k];}).filter(Boolean);
  if(!picked.length) return;
  $('caseAdd').disabled=true; $('caseAdd').textContent='جارٍ الجلب…';
  var jobs=picked.map(function(a){
    return fetch(API+'cases/file?id='+encodeURIComponent(a.id),{headers:authH()}).then(function(r){return r.json();}).then(function(d){
      if(!d||!d.data) return; var mime=d.mimetype||a.mimetype||'application/octet-stream';
      var ext=(d.name||a.name||'').split('.').pop().toLowerCase();
      var media=/^audio\//.test(mime)||/^video\//.test(mime);
      var url=''; try{ var bin=atob(d.data); var arr=new Uint8Array(bin.length); for(var i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i); url=URL.createObjectURL(new Blob([arr],{type:mime})); }catch(e){}
      atts.push({name:d.name||a.name,mime:mime,ext:ext,media:media,file:null,url:url,data:media?'':d.data});
    }).catch(function(){});
  });
  Promise.all(jobs).then(function(){ $('caseAdd').textContent='➕ إضافة لعون'; $('caseLayer').classList.remove('show'); renderChips();
    if(picked.some(function(a){return /^audio\//.test(a.mimetype||'')||/^video\//.test(a.mimetype||'');})) alert('ملاحظة: المرفقات المجلوبة من القضية تُقرأ كنصّ/صورة/PDF. تفريغ التسجيلات الصوتية يتطلب رفعها من جهازك مباشرة.'); });
}

/* ===== نموذج التحكم ===== */
function grow(){ ta.style.height='auto'; ta.style.height=Math.min(ta.scrollHeight,140)+'px'; }
function setModel(k){ $('ak-model').value=k; $('mdlLabel').textContent=AK_MLBL[MODELS[k].id]||k;
  document.querySelectorAll('#mdl .menu button').forEach(function(b){ b.classList.toggle('on',b.dataset.m===k); });
  try{ localStorage.setItem('ak_word_model',k); }catch(e){}
}

/* ===== تشغيل ===== */
Office.onReady(function(){
  chat=$('chat'); ta=$('ta');
  function enterApp(){ $('loginView').classList.add('hidden'); $('appView').classList.remove('hidden'); store=loadAll(); renderHist(); newChat(); }
  if(token()) enterApp();

  $('loginBtn').onclick=function(){
    var u=$('user').value.trim(), p=$('pass').value.replace(/\s/g,'');
    var st=$('loginStatus');
    if(!u||!p){ st.className='lstatus show warn'; st.textContent='أدخل البيانات'; return; }
    var t=btoa(u+':'+p); st.className='lstatus show warn'; st.textContent='جاري التحقق…'; $('loginBtn').disabled=true;
    fetch(API+'ping',{headers:{Authorization:'Basic '+t}}).then(function(r){ return r.ok?r.json():Promise.reject(); })
      .then(function(){ localStorage.setItem('ak_token',t); $('loginBtn').disabled=false; enterApp(); })
      .catch(function(){ $('loginBtn').disabled=false; st.className='lstatus show err'; st.textContent='تعذّر الدخول. تأكد من البيانات.'; });
  };
  $('logout').onclick=function(e){ e.preventDefault(); localStorage.removeItem('ak_token'); location.reload(); };

  /* نموذج + قوائم */
  var savedM=localStorage.getItem('ak_word_model'); if(savedM&&MODELS[savedM]) setModel(savedM); else setModel('opus');
  $('mdlBtn').onclick=function(e){ e.stopPropagation(); $('mdl').classList.toggle('open'); };
  document.querySelectorAll('#mdl .menu button').forEach(function(b){ b.onclick=function(){ setModel(this.dataset.m); $('mdl').classList.remove('open'); }; });
  $('plusBtn').onclick=function(e){ e.stopPropagation(); $('mw').classList.toggle('open'); };
  $('btnNew').onclick=function(){ if(busy) return; newChat(); };
  $('btnHist').onclick=function(){ renderHist(); $('histbar').classList.toggle('open'); };
  document.addEventListener('click',function(){ $('mdl').classList.remove('open'); $('mw').classList.remove('open'); });

  /* قائمة + */
  $('mw').querySelectorAll('.pmenu button').forEach(function(b){ b.onclick=function(e){ e.stopPropagation(); $('mw').classList.remove('open');
    if(b.dataset.gen){ genDoc=b.dataset.gen; renderChips(); ta.focus(); return; }
    var act=b.dataset.act;
    if(act==='file'){ $('fileInput').click(); }
    else if(act==='case'){ openCasePicker(); }
    else if(act==='style'){ styleSelection(); }
    else if(act==='letter'){ applyLetterhead(); }
  }; });
  $('fileInput').onchange=function(e){ var fs=e.target.files; for(var i=0;i<fs.length;i++) addFile(fs[i]); e.target.value=''; };

  /* سجل: فتح/حذف */
  $('histpanel').addEventListener('click',function(e){
    var del=e.target.closest('[data-del]');
    if(del){ e.stopPropagation(); store=store.filter(function(x){return x.id!==del.dataset.del;}); saveAll(store); if(curId===del.dataset.del) newChat(); renderHist(); return; }
    var it=e.target.closest('.hitem'); if(!it) return;
    var c=store.filter(function(x){return x.id===it.dataset.id;})[0]; if(!c) return;
    curId=c.id; conv=c.conv.slice(); redraw(); renderHist(); $('histbar').classList.remove('open');
  });

  /* إرسال/إيقاف */
  $('send').onclick=function(){ if(busy){ if(aborter) aborter.abort(); } else { send(); } };
  ta.addEventListener('input',grow);
  ta.addEventListener('keydown',function(e){ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); if(!busy) send(); } });
  chat.addEventListener('scroll',function(){ akStick=akAtBottom(); if(akStick){ akUnseen=0; $('jump').classList.remove('show'); $('jn').textContent=''; } });
  $('jump').onclick=akToBottom;

  /* معاينة */
  $('pvClose').onclick=function(){ $('prev').classList.remove('show'); $('pvb').innerHTML=''; };
  $('prev').onclick=function(e){ if(e.target===this) $('pvClose').click(); };

  /* منتقي القضايا */
  $('caseBack').onclick=function(){
    if(caseState.view==='atts'){
      if($('caseSearch').value.trim()){ $('caseSearch').value=''; renderCaseLevel(); return; }
      if(caseState.path.length){ caseState.path.pop(); caseState.cur=caseState.path.length?caseState.path[caseState.path.length-1].id:0; renderCaseLevel(); return; }
      openCasePicker();
    } else { $('caseLayer').classList.remove('show'); }
  };
  $('caseAdd').onclick=addCaseSelection;
  var cst=null;
  $('caseSearch').addEventListener('input',function(){ clearTimeout(cst); var q=this.value.trim(); cst=setTimeout(function(){ if(caseState.view==='cases') loadCases(q); else if(q) renderCaseSearch(q); else renderCaseLevel(); },300); });
});
</script>
